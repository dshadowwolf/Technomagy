plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'com.diffplug.spotless' version '8.9.0'
}

// Import-block step for Spotless and its fixture tests (AGENTS.md section 2).
apply from: 'gradle/import-blocks.gradle'
apply from: 'gradle/spell-heuristics.gradle'
apply from: 'gradle/spell-icon-checks.gradle'

// Shared Eclipse JDT profile: four-space blocks and four-space continuations.
// VS Code uses the same XML profile; import grouping remains a separate custom step.
// spotlessCheck remains part of check/build. Do not reformat unrelated code when changing policy.

spotless {
    java {
        eclipse('4.35').configFile('gradle/java-formatter.xml')
        custom 'importBlocks', importBlocksStep
    }
}

group = 'zone.moddev.mc'
version = mod_version

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }

    // accessTransformers = files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            gameDirectory = project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be added/removed as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main {
    // Include resources generated by data generators.
    resources { srcDir 'src/generated/resources' }
}

repositories {
    ivy {
        name = 'AbilityCorePublicRelease'
        url = uri('https://github.com/HexaHexes/ability-core/releases/download')
        patternLayout { artifact 'v[revision]/[artifact]-[revision].[ext]' }
        metadataSources { artifact() }
        content { includeModule 'org.bitwisemadness.abilitycore', 'ability_core' }
    }
    ivy {
        name = 'AbilityHotbarPublicRelease'
        url = uri('https://github.com/HexaHexes/ability-hotbar/releases/download')
        patternLayout { artifact 'v[revision]/[artifact]-[revision].[ext]' }
        metadataSources { artifact() }
        content { includeModule 'org.bitwisemadness.abilityhotbar', 'ability_hotbar' }
    }
    maven {
        name = 'ModDevZone'
        url = uri('https://maven.moddev.zone/releases')
        content {
            includeGroupByRegex 'zone\\.moddev\\.mc.*'
        }
    }
    
    maven { url 'https://maven.blamejared.com' }
    maven { url 'https://maven.createmod.net' }
}

dependencies {
    implementation "zone.moddev.mc.skysleylines:SkysLeyLines:${skysleylines_version}"
    implementation 'org.bitwisemadness.abilitycore:ability_core:1.1.0-alpha.14'
    implementation 'org.bitwisemadness.abilityhotbar:ability_hotbar:1.0.1-alpha.22'
    // Guidebook (dev.gigaherz.guidebook) has no 1.21.1 release; books.json is still shipped and
    // will be picked up if Guidebook is installed.
    implementation "zone.moddev.mc.lib:mmdlib:${mmdlib_version}"
    runtimeOnly "zone.moddev.mc.orespawn:OreSpawn:${orespawn_version}"
    compileOnly "vazkii.patchouli:Patchouli:1.21.1-93-NEOFORGE:api"
    runtimeOnly "vazkii.patchouli:Patchouli:1.21.1-93-NEOFORGE"
    implementation "net.createmod.ponder:ponder-neoforge:1.0.87+mc1.21.1"
}

// ${file.jarVersion} only resolves from a built jar, so fill in the version for dev runs too.
processResources {
    def props = [mod_version: mod_version, skysleylines_version: skysleylines_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

apply from: 'gradle/spell-gametests.gradle'
